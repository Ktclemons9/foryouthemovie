<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var db = supabase.createClient(
    'https://qaezwlmsajpkbsjunsxl.supabase.co',
    'sb_publishable_geTyYMPIAoHsU_MNZ9_wJQ_vD7LFYXJ'
  );

  var vid = localStorage.getItem('fy_vid');
  if (!vid) {
    vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
    localStorage.setItem('fy_vid', vid);
  }
  function fmt(n) { return n.toLocaleString(); }

  document.querySelectorAll('.post').forEach(function (p, i) {
    var btn = p.querySelector('.like');
    if (!btn) return;
    var id = 'post-' + i, count = 0, mine = false;
    function draw() {
      btn.classList.toggle('liked', mine);
      btn.textContent = (mine ? '♥ ' : '♡ ') + fmt(count);
    }
    Promise.all([
      db.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', id),
      db.from('likes').select('post_id').eq('post_id', id).eq('visitor_id', vid)
    ]).then(function (r) {
      count = r[0].count || 0;
      mine = (r[1].data || []).length > 0;
      draw();
    });
    btn.onclick = function () {
      mine = !mine; count += mine ? 1 : -1; draw();
      var q = mine
        ? db.from('likes').insert({ post_id: id, visitor_id: vid })
        : db.from('likes').delete().eq('post_id', id).eq('visitor_id', vid);
      q.then(function (res) {
        if (res.error) { mine = !mine; count += mine ? 1 : -1; draw(); }
      });
    };
  });

  var fb = document.getElementById('followBtn');
  var fc = document.getElementById('fcount');
  var base = 1000000, fcount = 0, following = false;
  function drawF() {
    fb.classList.toggle('on', following);
    fb.textContent = following ? 'Following' : 'Follow';
    fc.textContent = fmt(base + fcount);
  }
  Promise.all([
    db.from('follows').select('*', { count: 'exact', head: true }),
    db.from('follows').select('visitor_id').eq('visitor_id', vid)
  ]).then(function (r) {
    fcount = r[0].count || 0;
    following = (r[1].data || []).length > 0;
    drawF();
  });
  fb.onclick = function () {
    following = !following; fcount += following ? 1 : -1; drawF();
    var q = following
      ? db.from('follows').insert({ visitor_id: vid })
      : db.from('follows').delete().eq('visitor_id', vid);
    q.then(function (res) {
      if (res.error) { following = !following; fcount += following ? 1 : -1; drawF(); }
    });
  };
})();
</script>
